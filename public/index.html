<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNO FLEX ONLINE</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div class="logo">UNO <span>FLEX</span></div><div class="sub">ONLINE CARD BATTLE</div></header><section id="lobby" class="panel"><h1>UNO FLEX ONLINE</h1><p>Tạo phòng hoặc nhập mã phòng để chơi cùng bạn bè.</p><input id="name" maxlength="18" placeholder="Tên của bạn" value="Người chơi"><div class="actions"><button id="create">TẠO PHÒNG</button></div><div class="join"><input id="room" maxlength="5" placeholder="MÃ PHÒNG"><button id="join">THAM GIA</button></div><p id="message"></p><div id="waiting" hidden><h2>Phòng: <b id="code"></b></h2><p>Gửi mã này cho bạn bè. Cần ít nhất 2 người.</p><div id="waitingPlayers"></div><button id="start">BẮT ĐẦU</button></div></section><section id="game" hidden><div class="topbar"><span>PHÒNG <b id="gameCode"></b></span><span id="turnText"></span><span id="counts"></span></div><div class="table"><div id="opponents" class="opponents"></div><div class="center"><div class="pile"><small>BÀI BỎ</small><div id="topCard"></div></div><div class="pile"><small>BÀI RÚT</small><div class="back">UNO</div><b id="drawCount"></b></div></div><div id="feed" class="feed"></div></div><div class="controls"><button id="draw">RÚT 1 LÁ</button><button id="uno">UNO!</button></div><h3>BÀI CỦA BẠN <span id="power"></span></h3><div id="hand" class="hand"></div></section></main><div id="modal" class="modal" hidden><div class="modalbox"><h2 id="modalTitle">Chọn màu</h2><div id="modalBody"></div><button id="cancel">HỦY</button></div></div><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
